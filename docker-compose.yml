# =============================================================================
# Biddu Docker Compose
$__NOP__$
# =============================================================================

name: biddu

services:
  # ---------------------------------------------------------------------------
  # SubastaYa Application
  # ---------------------------------------------------------------------------
  biddu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biddu
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Database (SQLite - stored in volume)
      - DATABASE_URL=file:./data/biddu.db
      # Authentication (REQUIRED - generate with: openssl rand -base64 32)
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      # Storage
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      # Optional: S3 storage
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      # Optional: Email
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-noreply@biddu.cl}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Biddu}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - TZ=America/Santiago
      - CRON_SECRET=${CRON_SECRET:-}
      # Optional: OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      # Optional: reCAPTCHA
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      # Optional: Realtime (Soketi)
      - NEXT_PUBLIC_REALTIME_DRIVER=${NEXT_PUBLIC_REALTIME_DRIVER:-disabled}
      - NEXT_PUBLIC_SOKETI_APP_KEY=${NEXT_PUBLIC_SOKETI_APP_KEY:-}
      - NEXT_PUBLIC_SOKETI_HOST=${NEXT_PUBLIC_SOKETI_HOST:-soketi}
      - NEXT_PUBLIC_SOKETI_PORT=${NEXT_PUBLIC_SOKETI_PORT:-6001}
      - NEXT_PUBLIC_SOKETI_USE_TLS=${NEXT_PUBLIC_SOKETI_USE_TLS:-false}
      - SOKETI_APP_ID=${SOKETI_APP_ID:-biddu}
      - SOKETI_APP_SECRET=${SOKETI_APP_SECRET:-}
      - SOKETI_HOST=soketi
      # Features
      - ALLOW_OPEN_AUCTIONS=${ALLOW_OPEN_AUCTIONS:-false}
    volumes:
      # Persist database and uploads
      - biddu-data:/app/data
      - biddu-uploads:/app/public/uploads
      - biddu-logs:/app/logs
    depends_on:
      - soketi
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Caddy - HTTPS reverse proxy (TLS termination for LAN)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: biddu-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-192.168.1.16}
      - APP_HOST=biddu
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - biddu-caddy-data:/data
      - biddu-caddy-config:/config
    depends_on:
      - biddu
    healthcheck:
      disable: true

  # ---------------------------------------------------------------------------
  # Soketi - WebSocket Server (Optional, for realtime features)
  # ---------------------------------------------------------------------------
  soketi:
    image: quay.io/soketi/soketi:latest
    container_name: soketi
    restart: unless-stopped
    ports:
      - "6001:6001"
    environment:
      - SOKETI_DEBUG=${SOKETI_DEBUG:-false}
      - SOKETI_DEFAULT_APP_ID=${SOKETI_APP_ID:-biddu}
      - SOKETI_DEFAULT_APP_KEY=${NEXT_PUBLIC_SOKETI_APP_KEY:-}
      - SOKETI_DEFAULT_APP_SECRET=${SOKETI_APP_SECRET:-}
      - SOKETI_DEFAULT_APP_HOST=0.0.0.0


# -----------------------------------------------------------------------------
# Volumes for data persistence
# -----------------------------------------------------------------------------
volumes:
  biddu-caddy-data:
    driver: local
  biddu-caddy-config:
    driver: local
  biddu-data:
    driver: local
  biddu-uploads:
    driver: local
  biddu-logs:
    driver: local
