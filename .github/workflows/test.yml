name: Test

# Typecheck + unit tests + production build on every PR to main.
# This is the required check before merging (see branch protection).
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Unit + Build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Dummy DSN: unit tests import the prisma client but never connect.
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Migrations match schema on a fresh database
        # Guards the self-hosted first boot: `migrate deploy` must succeed on
        # an empty SQLite file (this is what the compose `migrate` service
        # runs) AND produce exactly the schema (catches models/columns added
        # via db push without a migration, which brick fresh deployments).
        run: |
          rm -f /tmp/fresh-deploy-check.db /tmp/schema-push-check.db
          DATABASE_URL=file:/tmp/fresh-deploy-check.db npx prisma migrate deploy
          DATABASE_URL=file:/tmp/schema-push-check.db npx prisma db push --accept-data-loss
          node scripts/check-migration-drift.mjs /tmp/fresh-deploy-check.db /tmp/schema-push-check.db
          rm -f /tmp/fresh-deploy-check.db /tmp/schema-push-check.db

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx tsx --test "src/**/*.test.ts"

      - name: i18n key audit
        # Every useTranslations("literal") must exist in messages/{es,en,pt-BR}.
        # Missing keys throw MISSING_MESSAGE during prerender (noisy build)
        # and at runtime. Dynamic calls are listed but not gated.
        run: node scripts/i18n-audit.mjs

      # NOTE: no lint gate yet — `npx eslint src` currently reports 26
      # pre-existing errors (react-hooks/*, no-explicit-any...). Fix them
      # first, then add `- npx eslint src` here.
      - name: Build
        run: npm run build
